# The premise register (Architecture/20261002-Phase10.md section 4).
#
# Each entry is one fact a design relies on about Blizzard's code: where a design
# says so (source), what to re-read when it stops holding (consequence), and how
# to check it. Paths are relative to the export's Interface/AddOns, with forward
# slashes. README rule 11: a design that relies on such a fact adds it here, in the
# same change.
#
# Check kinds:
#   Callers    name, files, count   the call sites of name lie exactly in files
#   Defined    name                 a loaded file defines name at file scope
#   Pattern    file, regex, expect  the regex is Present or Absent in the file
#   FlagAbsent entry, flag          the documented entry does not carry flag
#   FlagEquals entry, flag, value   every documented entry of that name carries flag
#                                   with exactly value, as the docs write it (a string
#                                   keeps its quotes); since Phase 11 section 7.1
#   Watch      files                every file is unchanged since the baseline
#
# Hook targets, bag events and every documented function and event the addon uses
# are not listed: the derived surface (section 5) finds them in the code each run.

