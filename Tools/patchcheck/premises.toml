# The premise register (Architecture/20261002-Phase10.md section 4).
#
# Each entry is one fact a design relies on about Blizzard's code: where a design
# says so (source), what to re-read when it stops holding (consequence), and how
# to check it. Paths are relative to the export's Interface/AddOns, with forward
# slashes. README rule 11: a design that relies on such a fact adds it here, in the
# same change.
#
# Check kinds:
#   Callers    name, files, count   the call sites of name lie exactly in files
#   Defined    name                 a loaded file defines name at file scope
#   Pattern    file, regex, expect  the regex is Present or Absent in the file
#   FlagAbsent entry, flag          the documented entry does not carry flag
#   FlagEquals entry, flag, value   every documented entry of that name carries flag
#                                   with exactly value, as the docs write it (a string
#                                   keeps its quotes); since Phase 11 section 7.1
#   Watch      files                every file is unchanged since the baseline
#
# Hook targets, bag events and every documented function and event the addon uses
# are not listed: the derived surface (section 5) finds them in the code each run.

[[premise]]
id = "G1-SOLE-CALLER"
statement = "SetPreferredGamepadInteractTarget has exactly one caller"
source = "Phase 9 section 6.3"
consequence = "BlockWatch labels refusals by the wrong rule. Re-check classify_refusal (Core/BlockWatch.lua)"
check = { kind = "Callers", name = "SetPreferredGamepadInteractTarget", files = ["Blizzard_GamepadActionBars/MainActionBarFrame.lua"], count = 1 }

[[premise]]
id = "G1-PATH"
statement = "G1's mechanism, as GAPBugs01 sections 2 and 2.9 describe it"
source = "GAPBugs01 sections 1.4 and 2.9"
consequence = "Re-read GAPBugs01 section 2 against the diff. If Blizzard fixed G1, retire BlockWatch's hint and the README's known issue"
check = { kind = "Watch", files = [
    "Blizzard_GamepadActionBars/MainActionBarFrame.lua",
    "Blizzard_GamepadActionBars/PageUnit.lua",
    "Blizzard_GamepadSharedUtility/FrameControlsManager.lua",
    "Blizzard_GamepadSharedUtility/FrameReformUtility.lua",
    "Blizzard_GamepadSharedUtility/InputBindingStack/InputBindingManager.lua",
    "Blizzard_GamepadSharedUtility/InputBindingStack/BindingSetFactory.lua",
    "Blizzard_GamepadSharedUtility/PromptedBindings/PromptedBindingFooter.lua",
    "Blizzard_GamepadSmartNavigation/SmartNavigation.lua",
    "Blizzard_GamepadSmartNavigation/Utility.lua",
    "Blizzard_StaticPopup/StaticPopupGamepad.lua",
    "Blizzard_Settings_Shared/Blizzard_SettingsPanel.lua",
    "Blizzard_UIParentPanelManager/Shared/UIParentPanelManager.lua",
] }

[[premise]]
id = "PLATE-HEALTHBAR"
statement = "Nameplate frames alias healthBar to HealthBarsContainer.healthBar"
source = "GAPBugs01 section 1.4; Phase 7"
consequence = "Nameplate colours find no bar (Features/Nameplates.lua)"
check = { kind = "Pattern", file = "Blizzard_NamePlates/Blizzard_NamePlateUnitFrame.lua", regex = 'self\.healthBar\s*=\s*self\.HealthBarsContainer\.healthBar', expect = "Present" }

[[premise]]
id = "PLATE-COLOUR"
