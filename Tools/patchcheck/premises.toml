consequence = "BlockWatch labels refusals by the wrong rule. Re-check classify_refusal (Core/BlockWatch.lua)"
check = { kind = "Callers", name = "SetPreferredGamepadInteractTarget", files = ["Blizzard_GamepadActionBars/MainActionBarFrame.lua"], count = 1 }

